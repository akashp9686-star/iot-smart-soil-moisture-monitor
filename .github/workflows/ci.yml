name: Project 03 firmware build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  uno-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create local credentials header from example
        run: cp include/config.example.h include/config.h
      - name: Compile Arduino Uno firmware
        run: pio run -e uno
