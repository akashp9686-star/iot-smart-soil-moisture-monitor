name: Project 06 firmware build and repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile Arduino Uno firmware
        run: pio run -e uno
      - name: Run repository tests when present
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v; else echo "No automated tests directory; hardware verification remains a separate step."; fi
